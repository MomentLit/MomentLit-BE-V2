services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: date_search_verification
      POSTGRES_USER: verifier
      POSTGRES_PASSWORD: ${DATE_SEARCH_DB_PASSWORD:?required}
    volumes:
      - verification_pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U verifier -d date_search_verification']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    # Reuse only the Java runtime; mount the JAR built from this checkout.
    image: ${DATE_SEARCH_RUNTIME_IMAGE:-momentlit-be-v2-app:latest}
    entrypoint: [java, '-Duser.timezone=Asia/Seoul', '-jar', /verification/app.jar]
    volumes:
      - ${DATE_SEARCH_JAR:?required}:/verification/app.jar:ro
    ports:
      - '127.0.0.1:${DATE_SEARCH_API_PORT:-18080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: date_search_verification
      DB_USERNAME: verifier
      DB_PASSWORD: ${DATE_SEARCH_DB_PASSWORD:?required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${DATE_SEARCH_JWT_SECRET:?required}
      SPRING_CONFIG_IMPORT: ''
      JPA_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: 'false'
      FLYWAY_BASELINE_ON_MIGRATE: 'false'
      CHATBOT_BASE_URL: http://127.0.0.1:9
      CHATBOT_INTERNAL_API_KEY: ''
      CHATBOT_AI_SUMMARY_BATCH_SIZE: 0
      AWS_REGION: ap-northeast-2
      AWS_EC2_METADATA_DISABLED: 'true'
      CORS_ALLOWED_ORIGINS: http://localhost:3000
volumes:
  verification_pg:
