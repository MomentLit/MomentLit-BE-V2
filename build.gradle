plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'MomentLit-BE-V2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':common')
    implementation project(':modules:image')
    implementation project(':modules:admin')
    implementation project(':modules:user')
    implementation project(':modules:space')
    implementation project(':modules:auth')
    implementation project(':modules:matching')
    implementation project(':modules:popup')
    implementation project(':modules:alarm')
    implementation project(':modules:chating')
    implementation project(':modules:review')
    implementation project(':modules:like')
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-parameters'
    }
}
