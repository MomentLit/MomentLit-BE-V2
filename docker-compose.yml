services:
  postgres:
    image: postgres:16-alpine
    container_name: v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: momentlit
      POSTGRES_USER: momentlit
      POSTGRES_PASSWORD: momentlit1234@
    ports:
      - "5433:5432"
    volumes:
      - v2_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: v2-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v2-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: momentlit
      DB_USERNAME: momentlit
      DB_PASSWORD: momentlit1234@
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: momentlit-monolith-jwt-secret-key-for-local-test-1234567890
      CHATBOT_BASE_URL: http://host.docker.internal:8090
      CHATBOT_INTERNAL_API_KEY: ${CHATBOT_INTERNAL_API_KEY}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "8080:8080"

volumes:
  v2_postgres_data:
