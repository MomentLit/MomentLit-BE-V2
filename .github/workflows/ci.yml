name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install OpenCV runtime libraries
        # OpenCV(bytedeco) 리눅스 빌드의 stitching이 highgui(GTK2)에 링크되어 있어, 이 라이브러리가 없으면
        # 360도 사진 합성 테스트에서 네이티브 라이브러리를 불러오지 못한다(Dockerfile 런타임 이미지와 같은 패키지).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk2.0-0

      - name: Run tests
        run: ./gradlew test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Linux image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: momentlit-server:ci
