server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: MomentLit-BE-V2
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:momentlit}"
    username: "${DB_USERNAME:momentlit}"
    password: "${DB_PASSWORD:momentlit1234@}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: "${JPA_DDL_AUTO:validate}"
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: ${REDIS_PORT:6379}
      password: "${REDIS_PASSWORD:}"
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

jwt:
  secret: "${JWT_SECRET:momentlit-monolith-jwt-secret-key-for-local-test-1234567890}"
  access-token-expiration: 30m
  refresh-token-expiration: 14d

cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET_NAME:momentlit-images}

space-service:
  base-url: "${SPACE_SERVICE_BASE_URL:http://localhost:8082}"

cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"

oauth:
  google:
    client-id: "${GOOGLE_CLIENT_ID:}"
    client-secret: "${GOOGLE_CLIENT_SECRET:}"
    redirect-uri: "${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/oauth/google/callback}"
    authorization-uri: "https://accounts.google.com/o/oauth2/v2/auth"
    token-uri: "https://oauth2.googleapis.com/token"
    user-info-uri: "https://www.googleapis.com/oauth2/v3/userinfo"
    scope: "openid email profile"
  naver:
    client-id: "${NAVER_CLIENT_ID:}"
    client-secret: "${NAVER_CLIENT_SECRET:}"
    redirect-uri: "${NAVER_REDIRECT_URI:http://localhost:8080/auth/oauth/naver/callback}"
    authorization-uri: "https://nid.naver.com/oauth2.0/authorize"
    token-uri: "https://nid.naver.com/oauth2.0/token"
    user-info-uri: "https://openapi.naver.com/v1/nid/me"
  kakao:
    client-id: "${KAKAO_CLIENT_ID:}"
    client-secret: "${KAKAO_CLIENT_SECRET:}"
    redirect-uri: "${KAKAO_REDIRECT_URI:http://localhost:8080/auth/oauth/kakao/callback}"
    authorization-uri: "https://kauth.kakao.com/oauth/authorize"
    token-uri: "https://kauth.kakao.com/oauth/token"
    user-info-uri: "https://kapi.kakao.com/v2/user/me"
    scope: "account_email profile_nickname profile_image"
